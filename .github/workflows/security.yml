name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC: catches newly disclosed CVEs
  workflow_dispatch:

# Deny everything by default; each job below requests only what it needs.
permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Known vulnerabilities in dependencies (cryptography, etc.) from uv.lock
  dependency-audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Export locked dependencies
        run: uv export --frozen --all-groups --no-emit-project --no-hashes -o requirements-audit.txt

      - name: Audit against PyPI advisory DB / OSV
        run: uvx pip-audit --requirement requirements-audit.txt --no-deps --disable-pip --strict

  # 2. Insecure patterns in your own code (weak hashing, asserts, hardcoded secrets, etc.)
  bandit:
    name: Static analysis (Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Run Bandit
        run: uvx bandit -r easy_passwords -ll -f txt

  # 3. Deeper semantic analysis; results show up in the repo's Security tab
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write # upload results to the Security tab
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"

  # 4. Leaked secrets anywhere in git history.
  # Runs the Gitleaks CLI directly (no token passed in) instead of gitleaks-action,
  # which requires GITHUB_TOKEN on pull_request events.
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --source /repo --redact --verbose

  # 5. Block PRs that introduce vulnerable dependencies
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # only needed for the PR summary comment
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
